<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tuto Trampo</title>
</head>
<body>
    <div class="falaise">
        <div class="point"></div>
        <div class="trampo"></div>
        <div class="sol"></div>
    </div>
    <div class="parametre">
        <label>Hauteur Saut</label>
        <input type="float" id="hs" placeholder="Hauteur en m">
        <br>
        <label>Hauteur Trampo</label>
        <input type="float" id="ht" placeholder="Hauteur en m">
        <br>
        <label>Masse</label>
        <input type="float" id="m" placeholder="Poids en kg">
        <br>
        <label>Raideur</label>
        <input type="float" id="k" placeholder="Raideur N.m^-1">
        <br>
        <label>Viscosité</label>
        <input type="float" id="c" placeholder="Viscosité N.s.m^-1">
        <br>
        <br>
        <button class="start">Start</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
